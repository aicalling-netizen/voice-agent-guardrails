[project]
name = "voice-agent-guardrails"
version = "0.1.0"
description = "Deterministic safety rails for production voice agents: false-confirmation guard, silence watchdog, voicemail detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Abdelaty" }]
keywords = ["voice-ai", "llm", "telephony", "livekit", "sip", "guardrails"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Communications :: Telephony",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
